<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI & Refleksi | Dragon Training Academy</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-anime">
    <header class="site-header">
      <nav class="nav container">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div>
            <strong>DRAGON</strong>
            <span>TRAINING ACADEMY</span>
          </div>
        </div>
        <div class="nav-links">
          <a href="index.html">Utama</a>
          <a href="concept.html">Konsep</a>
          <a href="video.html">Video</a>
          <a href="activity.html">Aktiviti</a>
          <a href="quiz.html">Kuiz</a>
          <a href="reflection.html" class="active">AI & Refleksi</a>
          <a href="report.html">Laporan</a>
        </div>
      </nav>
    </header>

    <main class="page-shell container">
      <section class="page-header">
        <p class="eyebrow">AI Training Master</p>
        <h1>AI Pembantu Pembelajaran</h1>
      </section>

      <div class="ai-layout">
        <section class="panel chatbot-panel">
          <h2>Chatbot Pembantu</h2>
          <div id="chat-window" class="chat-window">
            <div class="chat-bubble bot">Hai! Saya AI Training Master. Tanya saya tentang halangan bertingkat.</div>
          </div>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" type="text" placeholder="Contoh: Apakah maksud halangan bertingkat?" />
            <button type="submit" class="btn btn-primary">Hantar</button>
          </form>
        </section>

        <section class="panel reflection-panel">
          <h2>Bahagian Refleksi</h2>
          <form id="reflection-form">
            <label>
              Apakah perkara baharu yang anda pelajari?
              <textarea id="lesson-learned" rows="3"></textarea>
            </label>
            <label>
              Adakah anda berjaya melompat melepasi halangan?
              <textarea id="jump-success" rows="2"></textarea>
            </label>
            <label>
              Adakah anda seronok melakukan aktiviti ini?
              <textarea id="enjoyment" rows="2"></textarea>
            </label>
            <label>
              Apakah cabaran yang anda hadapi?
              <textarea id="challenge" rows="3"></textarea>
            </label>
            <button type="submit" class="btn btn-primary">Simpan Refleksi</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>© 2026 Dragon Training Academy</p>
        <div class="footer-links">
          <a href="quiz.html">Kuiz</a>
          <a href="report.html">Laporan</a>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
